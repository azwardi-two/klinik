<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kunjungan Klinik</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input, textarea, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #007bff;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #0056b3;
        }

        .hasil-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .result {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #e9f7ef;
        }

        .error {
            background: #fdecea;
            color: red;
        }

        .container {
            max-width: 900px;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-bar input,
        .filter-bar button {
            width: auto;
            margin-top: 0;
        }
        .filter-bar input {
            flex: 1;
            min-width: 140px;
        }
        .filter-bar button {
            flex-shrink: 0;
        }
        .btn-refresh {
            background: #17a2b8;
        }
        .btn-refresh:hover {
            background: #138496;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 8px 10px;
            border: 1px solid #ddd;
            text-align: left;
            font-size: 14px;
        }
        th {
            background: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }

        .pagination {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .pagination button {
            width: auto;
            padding: 6px 12px;
            margin-top: 0;
        }
        .pagination button.active {
            background: #28a745;
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Registrasi Kunjungan</h2>

    <!-- 🔍 SEARCH -->
    <h3>Cari Pasien</h3>
    <select id="searchNama" onchange="onPasienSelected()">
        <option value="">-- Pilih Pasien --</option>
    </select>
    <button onclick="showFormPasienBaru()" style="background:#28a745;">+ Pasien Baru</button>

    <!-- ➕ PASIEN BARU -->
    <div id="formPasienBaru" style="display:none;">
        <p><em>Isi data pasien baru di bawah.</em></p>
        <h3>Pasien Baru</h3>
        <input type="text" id="namaBaru" placeholder="Nama">
        <input type="date" id="tglLahirBaru">
        <input type="text" id="alamatBaru" placeholder="Alamat">

        <select id="jkBaru">
            <option value="">Jenis Kelamin</option>
            <option value="L">Laki-laki</option>
            <option value="P">Perempuan</option>
        </select>

        <input type="text" id="noHpBaru" placeholder="No HP">
    </div>

    <hr>

    <!-- 🧾 FORM -->
    <form id="formKunjungan" onsubmit="event.preventDefault(); kirimData();">

        <h3>Data Kunjungan</h3>

        <input type="hidden" id="idpasien">

        <div id="wrapperNama">
            <input type="text" id="nama" placeholder="Nama pasien" readonly>
        </div>

        <textarea id="keluhan" placeholder="Keluhan" required></textarea>

        <input type="date" id="tgl_kunjungan" required>

        <button type="submit">Simpan Kunjungan</button>

    </form>

    <div id="result"></div>

    <hr>

    <h3>Daftar Kunjungan</h3>

    <div class="filter-bar">
        <input type="date" id="filterTglAwal">
        <span>s/d</span>
        <input type="date" id="filterTglAkhir">
        <button class="btn-refresh" onclick="loadKunjunganList()">⟳ Refresh</button>
    </div>

    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>No. Reg</th>
                    <th>Nama Pasien</th>
                    <th>Keluhan</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tbodyKunjungan">
                <tr><td colspan="5">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" id="paginationKunjungan"></div>

</div>

<script>

// 🔍 LOAD DROPDOWN
async function loadPasienDropdown() {
    try {
        const res = await fetch("http://127.0.0.1:8000/pasien/search?nama=");
        const data = await res.json();
        const select = document.getElementById("searchNama");
        select.innerHTML = '<option value="">-- Pilih Pasien --</option>';
        data.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p.id;
            opt.setAttribute("data-nama", p.nama);
            opt.textContent = `${p.nama} (RM: ${p.no_rm})`;
            select.appendChild(opt);
        });
    } catch (err) {
        console.error("Gagal load pasien", err);
    }
}

function onPasienSelected() {
    const select = document.getElementById("searchNama");
    const opt = select.options[select.selectedIndex];
    const id = opt.value;
    if (!id) return;
    const nama = opt.getAttribute("data-nama");
    pilihPasien(id, nama);
}

function showFormPasienBaru() {
    document.getElementById("formPasienBaru").style.display = "block";
    document.getElementById("wrapperNama").style.display = "none";
    document.getElementById("idpasien").value = "";
    document.getElementById("nama").value = "";
    document.getElementById("searchNama").value = "";

    document.getElementById("namaBaru").value = "";
    document.getElementById("tglLahirBaru").value = "";
    document.getElementById("alamatBaru").value = "";
    document.getElementById("jkBaru").value = "";
    document.getElementById("noHpBaru").value = "";
    document.getElementById("keluhan").value = "";
    document.getElementById("result").innerHTML = "";

    setTanggalSekarang();
}

// ✅ PILIH
function pilihPasien(id, nama) {
    document.getElementById("idpasien").value = id;
    document.getElementById("nama").value = nama;

    document.getElementById("formPasienBaru").style.display = "none";
    document.getElementById("wrapperNama").style.display = "block";
}

// 💾 SIMPAN
async function kirimData() {

    const idpasien = document.getElementById("idpasien").value;
    const tgl = document.getElementById("tgl_kunjungan").value;

    // VALIDASI
    if (!tgl) {
        alert("Tanggal wajib diisi");
        return;
    }

    const data = {
        idpasien: idpasien ? parseInt(idpasien) : null,
        keluhan: document.getElementById("keluhan").value,
        tgl_kunjungan: tgl
    };

    // pasien baru
    if (!idpasien) {
        data.nama = document.getElementById("namaBaru").value;
        data.alamat = document.getElementById("alamatBaru").value;
        data.tgl_lahir = document.getElementById("tglLahirBaru").value;
        data.jenis_kelamin = document.getElementById("jkBaru").value;
        data.no_hp = document.getElementById("noHpBaru").value;
    }

    try {
        const response = await fetch("http://127.0.0.1:8000/kunjungan/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) throw result;

        document.getElementById("result").innerHTML =
            `<div class="result">
                ✅ Berhasil<br>
                No RM: ${result.no_rm}<br>
                No Reg: ${result.no_reg}
            </div>`;

        resetForm();
        loadKunjunganList();

    } catch (err) {
        document.getElementById("result").innerHTML =
            `<div class="result error">
                ❌ Error: ${JSON.stringify(err)}
            </div>`;
    }
}

// 🔄 RESET
function resetForm() {
    document.getElementById("formKunjungan").reset();

    document.getElementById("idpasien").value = "";
    document.getElementById("nama").value = "";

    document.getElementById("formPasienBaru").style.display = "none";
    document.getElementById("searchNama").value = "";

    document.getElementById("wrapperNama").style.display = "block";

    //document.getElementById("formPasienBaruForm").reset();

    setTanggalSekarang();
}

// ⏰ DEFAULT DATE (LOCAL)
function setTanggalSekarang() {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    const local = new Date(now - offset).toISOString().slice(0,10);

    document.getElementById("tgl_kunjungan").value = local;
}

function setTanggalFilter() {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    const local = new Date(now - offset).toISOString().slice(0,10);
    document.getElementById("filterTglAwal").value = local;
    document.getElementById("filterTglAkhir").value = local;
}

let kunjunganPage = 1;

async function loadKunjunganList() {
    const tglAwal = document.getElementById("filterTglAwal").value;
    const tglAkhir = document.getElementById("filterTglAkhir").value;
    if (!tglAwal || !tglAkhir) return;

    document.getElementById("tbodyKunjungan").innerHTML =
        '<tr><td colspan="5">Memuat data...</td></tr>';

    try {
        const url = `http://127.0.0.1:8000/kunjungan/?tgl_awal=${tglAwal}&tgl_akhir=${tglAkhir}&page=${kunjunganPage}&limit=10`;
        const res = await fetch(url);
        const result = await res.json();

        if (!res.ok) throw result;

        renderKunjunganTable(result);
        renderPagination(result);
    } catch (err) {
        document.getElementById("tbodyKunjungan").innerHTML =
            `<tr><td colspan="5" style="color:red;">Gagal memuat data: ${JSON.stringify(err)}</td></tr>`;
        document.getElementById("paginationKunjungan").innerHTML = "";
    }
}

function renderKunjunganTable(result) {
    const tbody = document.getElementById("tbodyKunjungan");
    if (result.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5">Tidak ada data.</td></tr>';
        return;
    }
    tbody.innerHTML = result.data.map(r =>
        `<tr>
            <td>${r.tgl_kunjungan}</td>
            <td>${r.no_reg}</td>
            <td>${r.nama_pasien}</td>
            <td>${r.keluhan}</td>
            <td>${r.status}</td>
        </tr>`
    ).join("");
}

function renderPagination(result) {
    const div = document.getElementById("paginationKunjungan");
    const { page, total_pages } = result;
    if (total_pages <= 1) {
        div.innerHTML = "";
        return;
    }

    let html = `<button ${page <= 1 ? 'disabled' : ''} onclick="goToPage(${page - 1})">«</button>`;

    const maxShow = 5;
    let start = Math.max(1, page - Math.floor(maxShow / 2));
    let end = Math.min(total_pages, start + maxShow - 1);
    if (end - start + 1 < maxShow) {
        start = Math.max(1, end - maxShow + 1);
    }

    for (let i = start; i <= end; i++) {
        html += `<button class="${i === page ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    }

    html += `<button ${page >= total_pages ? 'disabled' : ''} onclick="goToPage(${page + 1})">»</button>`;

    div.innerHTML = html;
}

function goToPage(p) {
    kunjunganPage = p;
    loadKunjunganList();
}

window.onload = function () {
    setTanggalSekarang();
    setTanggalFilter();
    loadPasienDropdown();
    loadKunjunganList();
};

</script>

</body>
</html>
