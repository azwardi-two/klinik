<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kunjungan Klinik</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input, textarea, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #007bff;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #0056b3;
        }

        .hasil-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .result {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #e9f7ef;
        }

        .error {
            background: #fdecea;
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Registrasi Kunjungan</h2>

    <!-- 🔍 SEARCH -->
    <h3>Cari Pasien</h3>
    <select id="searchNama" onchange="onPasienSelected()">
        <option value="">-- Pilih Pasien --</option>
    </select>
    <button onclick="showFormPasienBaru()" style="background:#28a745;">+ Pasien Baru</button>

    <!-- ➕ PASIEN BARU -->
    <div id="formPasienBaru" style="display:none;">
        <p><em>Isi data pasien baru di bawah.</em></p>
        <h3>Pasien Baru</h3>
        <input type="text" id="namaBaru" placeholder="Nama">
        <input type="date" id="tglLahirBaru">
        <input type="text" id="alamatBaru" placeholder="Alamat">

        <select id="jkBaru">
            <option value="">Jenis Kelamin</option>
            <option value="L">Laki-laki</option>
            <option value="P">Perempuan</option>
        </select>

        <input type="text" id="noHpBaru" placeholder="No HP">
    </div>

    <hr>

    <!-- 🧾 FORM -->
    <form id="formKunjungan" onsubmit="event.preventDefault(); kirimData();">

        <h3>Data Kunjungan</h3>

        <input type="hidden" id="idpasien">

        <div id="wrapperNama">
            <input type="text" id="nama" placeholder="Nama pasien" readonly>
        </div>

        <textarea id="keluhan" placeholder="Keluhan" required></textarea>

        <input type="date" id="tgl_kunjungan" required>

        <button type="submit">Simpan Kunjungan</button>

    </form>

    <div id="result"></div>

</div>

<script>

// 🔍 LOAD DROPDOWN
async function loadPasienDropdown() {
    try {
        const res = await fetch("http://127.0.0.1:8000/pasien/search?nama=");
        const data = await res.json();
        const select = document.getElementById("searchNama");
        select.innerHTML = '<option value="">-- Pilih Pasien --</option>';
        data.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p.id;
            opt.setAttribute("data-nama", p.nama);
            opt.textContent = `${p.nama} (RM: ${p.no_rm})`;
            select.appendChild(opt);
        });
    } catch (err) {
        console.error("Gagal load pasien", err);
    }
}

function onPasienSelected() {
    const select = document.getElementById("searchNama");
    const opt = select.options[select.selectedIndex];
    const id = opt.value;
    if (!id) return;
    const nama = opt.getAttribute("data-nama");
    pilihPasien(id, nama);
}

function showFormPasienBaru() {
    document.getElementById("formPasienBaru").style.display = "block";
    document.getElementById("wrapperNama").style.display = "none";
    document.getElementById("idpasien").value = "";
    document.getElementById("nama").value = "";
    document.getElementById("searchNama").value = "";
}

// ✅ PILIH
function pilihPasien(id, nama) {
    document.getElementById("idpasien").value = id;
    document.getElementById("nama").value = nama;

    document.getElementById("formPasienBaru").style.display = "none";
    document.getElementById("wrapperNama").style.display = "block";
}

// 💾 SIMPAN
async function kirimData() {

    const idpasien = document.getElementById("idpasien").value;
    const tgl = document.getElementById("tgl_kunjungan").value;

    // VALIDASI
    if (!tgl) {
        alert("Tanggal wajib diisi");
        return;
    }

    const data = {
        idpasien: idpasien ? parseInt(idpasien) : null,
        keluhan: document.getElementById("keluhan").value,
        tgl_kunjungan: tgl
    };

    // pasien baru
    if (!idpasien) {
        data.nama = document.getElementById("namaBaru").value;
        data.alamat = document.getElementById("alamatBaru").value;
        data.tgl_lahir = document.getElementById("tglLahirBaru").value;
        data.jenis_kelamin = document.getElementById("jkBaru").value;
        data.no_hp = document.getElementById("noHpBaru").value;
    }

    try {
        const response = await fetch("http://127.0.0.1:8000/kunjungan/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) throw result;

        document.getElementById("result").innerHTML =
            `<div class="result">
                ✅ Berhasil<br>
                No RM: ${result.no_rm}<br>
                No Reg: ${result.no_reg}
            </div>`;

        resetForm(); // ✅ FIX

    } catch (err) {
        document.getElementById("result").innerHTML =
            `<div class="result error">
                ❌ Error: ${JSON.stringify(err)}
            </div>`;
    }
}

// 🔄 RESET
function resetForm() {
    document.getElementById("formKunjungan").reset();

    document.getElementById("idpasien").value = "";
    document.getElementById("nama").value = "";

    document.getElementById("formPasienBaru").style.display = "none";
    document.getElementById("searchNama").value = "";

    document.getElementById("wrapperNama").style.display = "block";

    //document.getElementById("formPasienBaruForm").reset();

    setTanggalSekarang();
}

// ⏰ DEFAULT DATE (LOCAL)
function setTanggalSekarang() {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    const local = new Date(now - offset).toISOString().slice(0,10);

    document.getElementById("tgl_kunjungan").value = local;
}

window.onload = function () {
    setTanggalSekarang();
    loadPasienDropdown();
};

</script>

</body>
</html>
